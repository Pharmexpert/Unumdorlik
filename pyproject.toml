[project]
name = "unumdorlik"
version = "0.1.0"
description = "AI podcast-video production line: topic -> dialogue -> audio -> Pixar slideshow -> YouTube"
requires-python = ">=3.12"
dependencies = [
  "typer>=0.15",
  "rich>=13",
  "pydantic>=2.7",
  "pyyaml>=6",
  "python-dotenv>=1",
  "httpx>=0.27",
]

[project.optional-dependencies]
llm = ["google-genai>=1.20", "anthropic>=0.50"]
audio = ["edge-tts>=7"]
pdf = ["reportlab>=4"]
align = ["whisperx>=3.3"]
youtube = ["google-api-python-client>=2.140", "google-auth-oauthlib>=1.2"]
images = ["pillow>=10"]
all = ["unumdorlik[llm,audio,pdf,youtube,images]"]

[project.scripts]
unumdorlik = "unumdorlik.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unumdorlik"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
