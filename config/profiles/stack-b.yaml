# Stack B — Claude Code (obuna) + Google AI Pro (Flow, NotebookLM). API hisob-kitob yo'q.
channel:
  name: "Unumdorlik English"
  niche: "English learning podcast for curious professionals"
  category_id: 27
  default_language: en
  timezone: Asia/Tashkent
  publish_times: ["09:00", "18:00"]     # kuniga 2 ta
  privacy_default: private

hosts:
  A:
    name: Mia
    role: teacher
    tts_voice: Kore                     # Gemini TTS ovozi; edge-tts fallback uchun avtomatik en-US-AriaNeural
    style: "warm, clear, slightly slow"
    description: "a woman in her early 30s, shoulder-length dark wavy hair, round glasses, mustard cardigan, kind smile"
  B:
    name: James
    role: learner
    tts_voice: Puck
    style: "curious, lively, friendly"
    description: "a man in his late 20s, short curly brown hair, light stubble, navy hoodie, expressive eyebrows"
  character_sheet_dir: assets/characters

script:
  provider: claude_cli                  # `claude -p` — Claude Code obunasi
  model: claude-opus-5-5
  target_words: 2500
  words_per_minute: 140
  vocab_items: 10
  sections: 4
  level: A2-B1
  cefr_wordlist: assets/cefr/wordlist.csv

audio:
  engine: gemini_tts                    # bepul daraja; limit tugasa avtomatik edge_tts
  gemini_tts_model: gemini-3.8-flash-tts
  sample_rate: 24000
  loudness_lufs: -16
  turn_gap_ms: 450
  section_gap_ms: 900

alignment:
  engine: auto                          # edge timestamps -> whisperx -> estimate

visuals:
  engine: flow_browser                  # Antigravity /images-flow (Flow: rasm bepul, AI Pro kreditlari Veo uchun)
  seconds_per_image: 35
  ken_burns: true
  intro_video: {enabled: false, model: veo-3.1}

render:
  subtitles: line
  vocab_cards: true
  chapter_titles: true

youtube:
  client_secrets: secrets/youtube_client_secret.json
  token_file: secrets/youtube_token.json
  upload_captions: true

approval:
  required: true
  channel: github_pr
